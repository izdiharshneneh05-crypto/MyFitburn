name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack FitBurn
        run: |
          unzip -o fitburn.zip -d src
          if [ -d src/fitburn ]; then cp -r src/fitburn/. .; else cp -r src/. .; fi
          rm -rf src
          ls -R lib
          grep -q FitBurnApp lib/main.dart || { echo "FitBurn code not found"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Add Android platform files
        run: |
          flutter create --org com.fitburn --project-name fitburn --platforms android /tmp/gen
          mkdir -p android
          cp -rn /tmp/gen/android/. android/
          grep -q FitBurnApp lib/main.dart
      - name: Enable desugaring
        run: |
          python3 - <<'EOF'
          import pathlib, re
          k = pathlib.Path('android/app/build.gradle.kts')
          if k.exists():
              p, f, d = k, '        isCoreLibraryDesugaringEnabled = true\n', '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p, f, d = pathlib.Path('android/app/build.gradle'), '        coreLibraryDesugaringEnabled true\n', "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          s = p.read_text()
          s = re.sub(r'(compileOptions\s*\{\n)', r'\1' + f, s, count=1) + d
          p.write_text(s)
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FitBurn-APK
          path: build/app/outputs/flutter-apk/app-release.apk
