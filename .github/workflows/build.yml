name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o fitburn-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter create --org com.fitburn --project-name fitburn --platforms android .
      - name: Enable desugaring
        run: |
          python3 - <<'EOF'
          import pathlib, re
          k = pathlib.Path('android/app/build.gradle.kts')
          if k.exists():
              p, f, d = k, '        isCoreLibraryDesugaringEnabled = true\n', '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p, f, d = pathlib.Path('android/app/build.gradle'), '        coreLibraryDesugaringEnabled true\n', "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          s = p.read_text()
          s = re.sub(r'(compileOptions\s*\{\n)', r'\1' + f, s, count=1) + d
          p.write_text(s)
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FitBurn-APK
          path: build/app/outputs/flutter-apk/app-release.apk
